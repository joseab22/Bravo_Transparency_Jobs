services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: joblens_postgres
    environment:
      POSTGRES_USER: joblens
      POSTGRES_PASSWORD: joblens_dev
      POSTGRES_DB: joblens
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U joblens -d joblens"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: joblens_redis
    command: redis-server --appendonly yes
    ports: ["6379:6379"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: ../infrastructure/docker/Dockerfile.backend
    container_name: joblens_backend
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://joblens:joblens_dev@postgres:5432/joblens
      REDIS_URL: redis://redis:6379/0
      ENV: development
      HF_HOME: /home/appuser/.cache/huggingface
    ports: ["8000:8000"]
    volumes:
      - ./backend:/app
      - hf_cache:/home/appuser/.cache/huggingface
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: ../infrastructure/docker/Dockerfile.backend
    container_name: joblens_worker
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://joblens:joblens_dev@postgres:5432/joblens
      REDIS_URL: redis://redis:6379/0
      ENV: development
      HF_HOME: /home/appuser/.cache/huggingface
    volumes:
      - ./backend:/app
      - hf_cache:/home/appuser/.cache/huggingface
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=1
    restart: unless-stopped

  beat:
    build:
      context: ./backend
      dockerfile: ../infrastructure/docker/Dockerfile.backend
    container_name: joblens_beat
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://joblens:joblens_dev@postgres:5432/joblens
      REDIS_URL: redis://redis:6379/0
      ENV: development
    volumes:
      - ./backend:/app
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    command: celery -A app.workers.celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: ../infrastructure/docker/Dockerfile.frontend
    container_name: joblens_frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      BACKEND_INTERNAL_URL: http://backend:8000
      NEXT_TELEMETRY_DISABLED: "1"
    ports: ["3000:3000"]
    depends_on:
      backend: {condition: service_healthy}
    command: npm run dev -- --hostname 0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  hf_cache: