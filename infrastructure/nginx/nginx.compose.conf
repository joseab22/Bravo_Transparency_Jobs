events {}

http {
    limit_req_zone $binary_remote_addr zone=joblens_public:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=joblens_admin:10m rate=5r/m;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;

    upstream frontend {
        server frontend:3000;
    }

    server {
        listen 80;
        server_name _;
        limit_req_status 429;

        location ~ ^/api/v1/jobs/[0-9]+/score$ {
            limit_req zone=joblens_admin burst=3 nodelay;
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            limit_req zone=joblens_public burst=20 nodelay;
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
