# Nginx reverse proxy config for self-hosted deployment.
# This file is intended to be included from nginx's http context, such as
# /etc/nginx/sites-enabled/joblens.

limit_req_zone $binary_remote_addr zone=joblens_public:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=joblens_admin:10m rate=5r/m;

upstream backend {
    server 127.0.0.1:8000;
}

upstream frontend {
    server 127.0.0.1:3000;
}

server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name yourdomain.com www.yourdomain.com;

    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 20M;
    limit_req_status 429;

    # Administrative mutation endpoint: much stricter limit.
    location ~ ^/api/v1/jobs/[0-9]+/score$ {
        limit_req zone=joblens_admin burst=3 nodelay;

        proxy_pass         http://backend;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Public read-only API.
    location /api/ {
        limit_req zone=joblens_public burst=20 nodelay;

        proxy_pass         http://backend;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # API documentation. Consider disabling it entirely in production.
    location ~ ^/(docs|redoc|openapi.json) {
        limit_req zone=joblens_public burst=5 nodelay;

        proxy_pass http://backend;
        proxy_set_header Host $host;
    }

    # Frontend.
    location / {
        proxy_pass         http://frontend;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
    }
}
